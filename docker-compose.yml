services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: posledu
      POSTGRES_PASSWORD: posledu
      POSTGRES_DB: posledu
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U posledu"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Separate from the API. The URL is fixed: a host DATABASE_URL must not redirect this process.
  worker:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://posledu:posledu@db:5432/posledu
      NOTIFY_LEASE_SECONDS: "30"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - ./backend/app:/app/app:ro

volumes:
  pgdata:
