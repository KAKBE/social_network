services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: posledu
      POSTGRES_PASSWORD: posledu
      POSTGRES_DB: posledu
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U posledu"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
